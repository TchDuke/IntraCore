core.cpu.lr=Регистр связи (R14): адрес возврата. В обработчике исключения — EXC_RETURN: 0xFFFFFFF9 — в поток на MSP, 0xFFFFFFFD — в поток на PSP, 0xFFFFFFF1 — в обработчик
core.cpu.pc=Счётчик команд (R15): адрес текущей команды
core.cpu.xpsr=Регистр состояния программы: флаги APSR, номер исключения IPSR, бит Thumb EPSR
core.cpu.xpsr.n=Отрицательный результат
core.cpu.xpsr.z=Нулевой результат
core.cpu.xpsr.c=Перенос (для вычитания — отсутствие заёма)
core.cpu.xpsr.v=Переполнение (знаковое)
core.cpu.xpsr.q=Насыщение (команды DSP)
core.cpu.xpsr.t=Состояние Thumb; у Cortex-M всегда 1, 0 — отказ INVSTATE
core.cpu.xpsr.isr_number=Номер текущего исключения (IPSR): 0 — поток, 2 — NMI, 3 — HardFault, 11 — SVCall, 14 — PendSV, 15 — SysTick, 16+n — IRQn
core.cpu.msp=Основной указатель стека: после сброса и всегда в обработчиках; начальное значение — первое слово таблицы векторов
core.cpu.psp=Указатель стека процесса: у потока при CONTROL.SPSEL = 1 (задачи ОСРВ)
core.cpu.primask=Маска приоритетов: 1 — запрещены все прерывания с настраиваемым приоритетом (__disable_irq)
core.cpu.primask.pm=1 — прерывания запрещены, работают только NMI и HardFault
core.cpu.basepri=Порог приоритета (M3/M4/M7): блокируются прерывания с числом приоритета >= BASEPRI; 0 — не блокирует
core.cpu.faultmask=Маска отказов (M3/M4/M7): 1 — запрещено всё, кроме NMI
core.cpu.control=Регистр CONTROL: привилегии и выбор стека в потоке

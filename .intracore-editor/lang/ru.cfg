core.scb.icsr.rettobase=1 — активное исключение единственное (возврат в поток)
core.scb.icsr.vectactive=Номер активного исключения, 0 — поток. 3 — HardFault, 11 — SVCall, 14 — PendSV, 15 — SysTick, 16+n — IRQn
core.scb.vtor=Смещение таблицы векторов: где лежит таблица прерываний (у Cortex-M0 нет)
core.scb.vtor.tbloff=Биты адреса таблицы [31:7]; таблица выровнена по своему размеру, округлённому до степени двойки
core.scb.aircr=Управление прерываниями и сбросом: программный сброс, группировка приоритетов. Запись — только с ключом VECTKEY = 0x05FA
core.scb.aircr.vectkey=Ключ записи: 0x05FA, иначе запись игнорируется. Читается 0xFA05
core.scb.aircr.endianness=0 — little-endian (у STM32 всегда)
core.scb.aircr.prigroup=Группировка приоритетов: деление байта приоритета на группу (вытеснение) и подприоритет
core.scb.aircr.sysresetreq=Запись 1 (с ключом) — системный сброс; так работает NVIC_SystemReset()
core.scb.aircr.vectclractive=Только для отладки: снять состояние активных исключений
core.scb.aircr.vectreset=Только для отладки: сброс ядра (без периферии)
core.scb.scr=Регистр управления системой: поведение сна
core.scb.scr.sevonpend=1 — новое ожидающее прерывание будит ядро из WFE, даже запрещённое
core.scb.scr.sleepdeep=1 — WFI/WFE уводит в глубокий сон (STOP/STANDBY у STM32, выбор в PWR); 0 — обычный Sleep
core.scb.scr.sleeponexit=1 — снова засыпать при возврате из прерывания в поток
core.scb.ccr=Регистр конфигурации: ловушки и выравнивание стека
core.scb.ccr.stkalign=1 — стек выравнивается на 8 байт при входе в исключение (у M0/M0+ всегда 1)
core.scb.ccr.bfhfnmign=1 — обработчики с приоритетом -1/-2 игнорируют точные ошибки шины
core.scb.ccr.div_0_trp=1 — деление на ноль (SDIV/UDIV) вызывает UsageFault вместо результата 0
core.scb.ccr.unalign_trp=1 — любой невыровненный доступ вызывает отказ (у M0/M0+ отказ всегда)
core.scb.ccr.usersetmpend=1 — непривилегированный код может писать STIR
core.scb.ccr.nonbasethrdena=1 — возврат в поток разрешён при активных исключениях
core.scb.shpr1=Приоритеты системных обработчиков 1: MemManage, BusFault, UsageFault
core.scb.shpr1.pri_6=Приоритет UsageFault
core.scb.shpr1.pri_5=Приоритет BusFault
core.scb.shpr1.pri_4=Приоритет MemManage
core.scb.shpr2=Приоритеты системных обработчиков 2: приоритет SVCall
core.scb.shpr2.pri_11=Приоритет SVCall (реализованы старшие биты: 2 у M0/M0+, 4 у STM32 M3/M4)
core.scb.shpr3=Приоритеты системных обработчиков 3: PendSV и SysTick
core.scb.shpr3.pri_15=Приоритет SysTick
core.scb.shpr3.pri_14=Приоритет PendSV (ОСРВ обычно ставит самый низкий)
core.scb.shcsr=Управление и состояние системных обработчиков: включение MemManage/BusFault/UsageFault; без него любой отказ становится HardFault
core.scb.shcsr.usgfaultena=1 — обработчик UsageFault включён (иначе — HardFault)
core.scb.shcsr.busfaultena=1 — обработчик BusFault включён (иначе — HardFault)
core.scb.shcsr.memfaultena=1 — обработчик MemManage включён (иначе — HardFault)
core.scb.shcsr.svcallpended=SVCall ожидает
core.scb.shcsr.busfaultpended=BusFault ожидает
core.scb.shcsr.memfaultpended=MemManage ожидает
core.scb.shcsr.usgfaultpended=UsageFault ожидает
core.scb.shcsr.systickact=SysTick активен
core.scb.shcsr.pendsvact=PendSV активен
core.scb.shcsr.svcallact=SVCall активен
core.scb.shcsr.usgfaultact=UsageFault активен
core.scb.shcsr.busfaultact=BusFault активен
core.scb.shcsr.memfaultact=MemManage активен
core.scb.cfsr=Состояние настраиваемых отказов: ПОЧЕМУ случился отказ. Биты держатся до записи 1
core.scb.cfsr.iaccviol=MemManage: выборка команды из области без права исполнения (часто — переход по плохому адресу)
core.scb.cfsr.daccviol=MemManage: нарушение доступа к данным; адрес — в MMFAR, если MMARVALID
core.scb.cfsr.munstkerr=MemManage при восстановлении стека на выходе из исключения
core.scb.cfsr.mstkerr=MemManage при сохранении стека на входе в исключение: переполнение стека в защищённую область
core.scb.cfsr.mlsperr=MemManage при ленивом сохранении регистров FPU
core.scb.cfsr.mmarvalid=В MMFAR лежит адрес отказа
core.scb.cfsr.ibuserr=BusFault при выборке команды (код по несуществующему адресу)
core.scb.cfsr.preciserr=Точная ошибка шины при доступе к данным; адрес — в BFAR, если BFARVALID. Типично: обращение к периферии с выключенным тактированием или по неверному адресу
core.scb.cfsr.impreciserr=Неточная ошибка шины (буферизованная запись): сохранённый PC стоит ПОСЛЕ виновной команды. Бит DISDEFWBUF в ACTLR делает её точной
core.scb.cfsr.unstkerr=BusFault при восстановлении стека на выходе из исключения
core.scb.cfsr.stkerr=BusFault при сохранении стека на входе в исключение: SP вне ОЗУ (переполнение стека или испорченный SP)
core.scb.cfsr.lsperr=BusFault при ленивом сохранении регистров FPU
core.scb.cfsr.bfarvalid=В BFAR лежит адрес отказа
core.scb.cfsr.undefinstr=UsageFault: неизвестная команда (испорченный код или переход в данные)
core.scb.cfsr.invstate=UsageFault: неверное состояние — попытка исполнять ARM-код вместо Thumb: переход по чётному адресу, например по нулевому или неинициализированному указателю на функцию
core.scb.cfsr.invpc=UsageFault: неверный EXC_RETURN при выходе из исключения (испорчен LR или стек)
core.scb.cfsr.nocp=UsageFault: команда сопроцессора (FPU) при выключенном FPU — включите CP10/CP11 в CPACR
core.scb.cfsr.unaligned=UsageFault: невыровненный доступ при UNALIGN_TRP или LDM/LDRD/STRD по невыровненному адресу
core.scb.cfsr.divbyzero=UsageFault: деление на ноль при DIV_0_TRP
core.scb.hfsr=Состояние HardFault: как возник отказ
core.scb.hfsr.debugevt=HardFault от события отладки (BKPT без подключённого отладчика)
core.scb.hfsr.forced=Настраиваемый отказ (MemManage/BusFault/UsageFault) поднят до HardFault: смотрите CFSR
core.scb.hfsr.vecttbl=Ошибка шины при чтении таблицы векторов (неверный VTOR или адрес таблицы)
core.scb.dfsr=Состояние отладочных событий: почему ядро остановилось для отладчика
core.scb.dfsr.external=Внешний запрос отладки
core.scb.dfsr.vcatch=Перехват вектора
core.scb.dfsr.dwttrap=Срабатывание точки наблюдения DWT
core.scb.dfsr.bkpt=Точка останова (команда BKPT или FPB)
core.scb.dfsr.halted=Запрос останова или шаг
core.scb.mmfar=Адрес отказа MemManage: действителен при CFSR.MMARVALID = 1
core.scb.mmfar.address=Адрес данных, вызвавший отказ MemManage
core.scb.bfar=Адрес ошибки шины: действителен при CFSR.BFARVALID = 1
core.scb.bfar.address=Адрес данных, вызвавший точную ошибку шины
core.systick=Системный таймер: 24-битный вычитающий счётчик ядра, обычно тик 1 мс у HAL/ОСРВ
core.systick.ctrl=Управление и состояние SysTick
core.systick.ctrl.countflag=1 — счётчик дошёл до 0 со времени прошлого чтения (чтение сбрасывает)
core.systick.ctrl.clksource=1 — частота ядра (HCLK); 0 — внешняя опорная (HCLK/8 у STM32)
core.systick.ctrl.tickint=1 — достижение 0 вызывает исключение SysTick
core.systick.ctrl.enable=1 — счётчик работает
core.systick.load=Значение перезагрузки: период = RELOAD + 1 тактов
core.systick.load.reload=Значение, загружаемое при достижении 0 (для 1 мс при 48 МГц — 47999)
core.systick.val=Текущее значение счётчика (любая запись обнуляет его и COUNTFLAG)
core.systick.val.current=Текущее значение счётчика
core.systick.calib=Калибровка SysTick
core.systick.calib.noref=1 — внешней опорной частоты нет
core.systick.calib.skew=1 — TENMS неточен
core.systick.calib.tenms=Значение перезагрузки для 10 мс
core.nvic=Контроллер прерываний NVIC: разрешение, ожидание и приоритеты IRQ. Бит n регистра — IRQ n (+32 на каждое следующее слово)
core.nvic.iser=Разрешение прерываний: запись 1 разрешает IRQ n; чтение 1 — разрешено (NVIC_EnableIRQ)
core.nvic.icer=Запрет прерываний: запись 1 запрещает IRQ n (NVIC_DisableIRQ)
core.nvic.ispr=Установка ожидания: запись 1 делает IRQ n ожидающим; чтение 1 — ожидает
core.nvic.icpr=Снятие ожидания: запись 1 снимает ожидание IRQ n
core.nvic.iabr=Активность прерываний: 1 — IRQ n сейчас обслуживается
core.nvic.ip=Приоритеты прерываний: байт на IRQ, реализованы старшие биты (меньше число — выше приоритет)
core.cpu=Регистры ядра процессора
core.cpu.r0=Регистр общего назначения; первый аргумент и возвращаемое значение функции (AAPCS)
core.cpu.r1=Регистр общего назначения; второй аргумент функции
core.cpu.r2=Регистр общего назначения; третий аргумент функции
core.cpu.r3=Регистр общего назначения; четвёртый аргумент функции
core.cpu.r4=Регистр общего назначения, сохраняется вызываемой функцией
core.cpu.r5=Регистр общего назначения, сохраняется вызываемой функцией
core.cpu.r6=Регистр общего назначения, сохраняется вызываемой функцией
core.cpu.r7=Регистр общего назначения, сохраняется вызываемой функцией; GCC держит в нём указатель кадра в коде Thumb
core.cpu.r8=Старший регистр, сохраняется вызываемой функцией (у M0/M0+ доступен немногим командам)
core.cpu.r9=Старший регистр, сохраняется вызываемой функцией (в некоторых ABI — платформенный)
core.cpu.r10=Старший регистр, сохраняется вызываемой функцией
core.cpu.r11=Старший регистр, сохраняется вызываемой функцией; указатель кадра в коде ARM
core.cpu.r12=Рабочий регистр между вызовами (IP); сохраняется автоматически при входе в исключение

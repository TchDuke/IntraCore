core.scb=System Control Block: core identification, exception control, sleep and fault status
core.scb.cpuid=CPU ID base register: which core this is
core.scb.cpuid.implementer=Implementer code: 0x41 = ARM
core.scb.cpuid.variant=Major revision (the r in rNpM)
core.scb.cpuid.architecture=Architecture: 0xC = ARMv6-M, 0xF = ARMv7-M
core.scb.cpuid.partno=Core part number: 0xC20 Cortex-M0, 0xC60 M0+, 0xC23 M3, 0xC24 M4, 0xC27 M7
core.scb.cpuid.revision=Minor revision (the p in rNpM)
core.scb.icsr=Interrupt Control and State Register: pending and active exceptions, software trigger of NMI/PendSV/SysTick
core.scb.icsr.nmipendset=Write 1: make NMI pending. Read: NMI is pending
core.scb.icsr.pendsvset=Write 1: make PendSV pending (context switch in an RTOS). Read: PendSV is pending
core.scb.icsr.pendsvclr=Write 1: remove the pending state of PendSV
core.scb.icsr.pendstset=Write 1: make SysTick pending. Read: SysTick is pending
core.scb.icsr.pendstclr=Write 1: remove the pending state of SysTick
core.scb.icsr.isrpreempt=An interrupt will be serviced on exit from debug halt
core.scb.icsr.isrpending=Some external interrupt (not NMI or fault) is pending
core.scb.icsr.vectpending=Exception number of the highest-priority pending exception, 0 = none
core.scb.icsr.rettobase=1: the active exception is the only one (return goes to thread mode)
core.scb.icsr.vectactive=Number of the active exception, 0 = thread mode. 3 = HardFault, 11 = SVCall, 14 = PendSV, 15 = SysTick, 16+n = IRQn
core.scb.vtor=Vector Table Offset Register: address of the vector table (not on Cortex-M0)
core.scb.vtor.tbloff=Vector table address bits [31:7]; the table must be aligned to its size rounded up to a power of two
core.scb.aircr=Application Interrupt and Reset Control Register: software reset, priority grouping. Writes need VECTKEY = 0x05FA
core.scb.aircr.vectkey=Write key: 0x05FA, otherwise the write is ignored. Reads 0xFA05
core.scb.aircr.endianness=0 = little-endian (always on STM32)
core.scb.aircr.prigroup=Priority grouping: split of the priority byte into group (preemption) and subpriority
core.scb.aircr.sysresetreq=Write 1 (with VECTKEY): request a system reset — this is NVIC_SystemReset()
core.scb.aircr.vectclractive=Debug only: clear active exception state
core.scb.aircr.vectreset=Debug only: reset the core (not peripherals)
core.scb.scr=System Control Register: sleep behaviour
core.scb.scr.sevonpend=1: a newly pending interrupt wakes the core from WFE even if disabled
core.scb.scr.sleepdeep=1: WFI/WFE enters deep sleep (STOP/STANDBY on STM32, chosen in PWR); 0: normal Sleep
core.scb.scr.sleeponexit=1: go back to sleep on return from an interrupt to thread mode
core.scb.ccr=Configuration and Control Register: traps and stack alignment
core.scb.ccr.stkalign=1: stack is aligned to 8 bytes on exception entry (always 1 on M0/M0+)
core.scb.ccr.bfhfnmign=1: handlers with priority -1/-2 ignore precise bus faults
core.scb.ccr.div_0_trp=1: division by zero (SDIV/UDIV) raises UsageFault instead of returning 0
core.scb.ccr.unalign_trp=1: any unaligned access raises a fault (on M0/M0+ always faults)
core.scb.ccr.usersetmpend=1: unprivileged code may write STIR
core.scb.ccr.nonbasethrdena=1: return to thread mode allowed with active exceptions
core.scb.shpr1=System Handler Priority Register 1: priorities of MemManage, BusFault, UsageFault
core.scb.shpr1.pri_6=UsageFault priority
core.scb.shpr1.pri_5=BusFault priority
core.scb.shpr1.pri_4=MemManage priority
core.scb.shpr2=System Handler Priority Register 2: SVCall priority
core.scb.shpr2.pri_11=SVCall priority (only the top bits are implemented: 2 on M0/M0+, 4 on STM32 M3/M4)
core.scb.shpr3=System Handler Priority Register 3: PendSV and SysTick priorities
core.scb.shpr3.pri_15=SysTick priority
core.scb.shpr3.pri_14=PendSV priority (RTOS usually sets it lowest)
core.scb.shcsr=System Handler Control and State Register: enable of MemManage/BusFault/UsageFault; without it every fault becomes HardFault
core.scb.shcsr.usgfaultena=1: UsageFault handler enabled (else escalates to HardFault)
core.scb.shcsr.busfaultena=1: BusFault handler enabled (else escalates to HardFault)
core.scb.shcsr.memfaultena=1: MemManage handler enabled (else escalates to HardFault)
core.scb.shcsr.svcallpended=SVCall is pending
core.scb.shcsr.busfaultpended=BusFault is pending
core.scb.shcsr.memfaultpended=MemManage is pending
core.scb.shcsr.usgfaultpended=UsageFault is pending
core.scb.shcsr.systickact=SysTick is active
core.scb.shcsr.pendsvact=PendSV is active
core.scb.shcsr.svcallact=SVCall is active
core.scb.shcsr.usgfaultact=UsageFault is active
core.scb.shcsr.busfaultact=BusFault is active
core.scb.shcsr.memfaultact=MemManage is active
core.scb.cfsr=Configurable Fault Status Register: WHY the fault happened. Bits are sticky: clear by writing 1
core.scb.cfsr.iaccviol=MemManage: instruction fetch from a region without execute permission (often a jump to a bad address)
core.scb.cfsr.daccviol=MemManage: data access violation; the address is in MMFAR if MMARVALID
core.scb.cfsr.munstkerr=MemManage on exception return unstacking
core.scb.cfsr.mstkerr=MemManage on exception entry stacking: stack overflow into a protected region
core.scb.cfsr.mlsperr=MemManage during lazy FPU state saving
core.scb.cfsr.mmarvalid=MMFAR holds the faulting address
core.scb.cfsr.ibuserr=BusFault on instruction fetch (code at a non-existent address)
core.scb.cfsr.preciserr=Precise BusFault on data access; BFAR holds the address if BFARVALID. Typical: access to a peripheral whose clock is off, or to a wrong address
core.scb.cfsr.impreciserr=Imprecise BusFault (buffered write): the stacked PC is AFTER the culprit. Set DISDEFWBUF in ACTLR to make it precise
core.scb.cfsr.unstkerr=BusFault on exception return unstacking
core.scb.cfsr.stkerr=BusFault on exception entry stacking: SP points outside RAM (stack overflow or corrupted SP)
core.scb.cfsr.lsperr=BusFault during lazy FPU state saving
core.scb.cfsr.bfarvalid=BFAR holds the faulting address
core.scb.cfsr.undefinstr=UsageFault: undefined instruction (corrupted code or jump into data)
core.scb.cfsr.invstate=UsageFault: invalid state — attempt to execute ARM (not Thumb) code: branch to an even address, e.g. a NULL or uninitialised function pointer
core.scb.cfsr.invpc=UsageFault: invalid EXC_RETURN on exception return (corrupted LR or stack)
core.scb.cfsr.nocp=UsageFault: coprocessor (FPU) instruction while the FPU is disabled — enable CP10/CP11 in CPACR
core.scb.cfsr.unaligned=UsageFault: unaligned access with UNALIGN_TRP set, or LDM/STRD/LDRD to an unaligned address
core.scb.cfsr.divbyzero=UsageFault: division by zero with DIV_0_TRP set
core.scb.hfsr=HardFault Status Register: how the HardFault arose
core.scb.hfsr.debugevt=HardFault from a debug event (BKPT without a debugger)
core.scb.hfsr.forced=A configurable fault (MemManage/BusFault/UsageFault) escalated to HardFault: look at CFSR
core.scb.hfsr.vecttbl=BusFault while reading the vector table (bad VTOR or table address)
core.scb.dfsr=Debug Fault Status Register: why the core halted for the debugger
core.scb.dfsr.external=External debug request
core.scb.dfsr.vcatch=Vector catch
core.scb.dfsr.dwttrap=DWT watchpoint match
core.scb.dfsr.bkpt=Breakpoint (BKPT instruction or FPB)
core.scb.dfsr.halted=Halt request or single step
core.scb.mmfar=MemManage Fault Address Register: faulting address when CFSR.MMARVALID = 1
core.scb.mmfar.address=Data address that caused the MemManage fault
core.scb.bfar=BusFault Address Register: faulting address when CFSR.BFARVALID = 1
core.scb.bfar.address=Data address that caused the precise BusFault
core.systick=System timer: 24-bit down counter of the core, usually the 1 ms tick of HAL/RTOS
core.systick.ctrl=SysTick Control and Status Register
core.systick.ctrl.countflag=1: counter reached 0 since the last read (reading clears it)
core.systick.ctrl.clksource=1: processor clock (HCLK); 0: external reference (HCLK/8 on STM32)
core.systick.ctrl.tickint=1: reaching 0 raises the SysTick exception
core.systick.ctrl.enable=1: counter runs
core.systick.load=SysTick Reload Value Register: period = RELOAD + 1 clocks
core.systick.load.reload=Value loaded when the counter reaches 0 (for 1 ms at 48 MHz: 47999)
core.systick.val=SysTick Current Value Register (any write clears it and COUNTFLAG)
core.systick.val.current=Current counter value
core.systick.calib=SysTick Calibration Value Register
core.systick.calib.noref=1: no external reference clock
core.systick.calib.skew=1: TENMS is not exact
core.systick.calib.tenms=Reload value for 10 ms
core.nvic=Nested Vectored Interrupt Controller: enable, pending and priority of IRQs. Bit n of a register = IRQ n (+32 per next word)
core.nvic.iser=Interrupt Set-Enable: write 1 to enable IRQ n; read 1 = enabled (NVIC_EnableIRQ)
core.nvic.icer=Interrupt Clear-Enable: write 1 to disable IRQ n (NVIC_DisableIRQ)
core.nvic.ispr=Interrupt Set-Pending: write 1 to make IRQ n pending; read 1 = pending
core.nvic.icpr=Interrupt Clear-Pending: write 1 to clear the pending state of IRQ n
core.nvic.iabr=Interrupt Active Bit: 1 = IRQ n is being serviced
core.nvic.ip=Interrupt Priority: one byte per IRQ, only the top bits are implemented (lower value = higher priority)
core.cpu=Processor core registers
core.cpu.r0=General-purpose register; first argument and return value of a function (AAPCS)
core.cpu.r1=General-purpose register; second argument of a function
core.cpu.r2=General-purpose register; third argument of a function
core.cpu.r3=General-purpose register; fourth argument of a function
core.cpu.r4=General-purpose register, callee-saved (the function must preserve it)
core.cpu.r5=General-purpose register, callee-saved
core.cpu.r6=General-purpose register, callee-saved
core.cpu.r7=General-purpose register, callee-saved; GCC uses it as the frame pointer in Thumb code
core.cpu.r8=High register, callee-saved (few Thumb-1 instructions reach it on M0/M0+)
core.cpu.r9=High register, callee-saved (platform register in some ABIs)
core.cpu.r10=High register, callee-saved
core.cpu.r11=High register, callee-saved; frame pointer in ARM (not Thumb) code
core.cpu.r12=Intra-procedure scratch register (IP); saved automatically on exception entry
core.cpu.sp=Stack pointer (R13): the active one of MSP/PSP. Must stay inside RAM; must be 8-byte aligned at calls
core.cpu.lr=Link register (R14): return address. Inside a handler holds EXC_RETURN: 0xFFFFFFF9 = return to thread using MSP, 0xFFFFFFFD = thread using PSP, 0xFFFFFFF1 = to handler
core.cpu.pc=Program counter (R15): address of the current instruction
core.cpu.xpsr=Program Status Register: APSR flags, IPSR exception number, EPSR Thumb bit
core.cpu.xpsr.n=Negative: result was negative
core.cpu.xpsr.z=Zero: result was zero
core.cpu.xpsr.c=Carry / not-borrow
core.cpu.xpsr.v=Overflow (signed)
core.cpu.xpsr.q=Saturation (DSP instructions)
core.cpu.xpsr.t=Thumb state; must always be 1 on Cortex-M, 0 means INVSTATE fault
core.cpu.xpsr.isr_number=Current exception number (IPSR): 0 = thread, 2 = NMI, 3 = HardFault, 11 = SVCall, 14 = PendSV, 15 = SysTick, 16+n = IRQn
core.cpu.msp=Main Stack Pointer: used after reset and always in handlers; initial value = first word of the vector table
core.cpu.psp=Process Stack Pointer: used by threads when CONTROL.SPSEL = 1 (RTOS tasks)
core.cpu.primask=Priority mask: 1 = all interrupts with configurable priority are disabled (__disable_irq)
core.cpu.primask.pm=1: interrupts disabled, only NMI and HardFault run
core.cpu.basepri=Base priority mask (M3/M4/M7): interrupts with priority value >= BASEPRI are blocked; 0 = no masking
core.cpu.faultmask=Fault mask (M3/M4/M7): 1 = everything except NMI is disabled, including HardFault escalation
core.cpu.control=CONTROL register: privilege and stack selection of thread mode
core.cpu.control.fpca=1: FPU context is active (floating point was used)
core.cpu.control.spsel=Thread mode stack: 0 = MSP, 1 = PSP
core.cpu.control.npriv=Thread privilege: 0 = privileged, 1 = unprivileged (M0+ with MPU, M3+)

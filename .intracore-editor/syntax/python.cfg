[Language]
Name=Python
Extensions=py
FileNames=
LineComment=#
BlockCommentBegin=
BlockCommentEnd=
StringChars=\"'
CharChars=
Preprocessor=
OperatorChars=()[]{}+-*/%=!<>&|^~.,:;?
PunctuationChars=()[]{}.,:;

[Heuristics]
FunctionCalls=true
Declarations=true
MemberAccess=true
Labels=false
UpperCaseMacros=false
LocalReferences=true
PreprocessorSymbols=false
Attributes=true

[ControlKeywords]
Words=break;continue;elif;else;except;finally;for;if;raise;return;try;while;with;yield

[DeclarationKeywords]
Words=as;async;await;class;def;del;from;global;import;lambda;nonlocal;pass

[Keywords]
Words=and;assert;in;is;not;or

[BuiltinTypes]
Words=int;float;str;bool;list;dict;tuple;set;object;bytes

[Constants]
Words=True;False;None

[Builtins]
Words=print;len;range;open;enumerate;zip;map;filter;isinstance;super

[Todo]
Words=TODO;FIXME;NOTE;WARNING;HACK;BUG

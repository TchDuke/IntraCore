# IntraCore: XML (SVD device descriptions, CubeMX databases). User-editable.
[Language]
Name=XML
Extensions=xml;svd;xsd;ioc;launch
FileNames=
LineComment=
BlockCommentBegin=<!--
BlockCommentEnd=-->
StringChars="'
CharChars=
Preprocessor=
OperatorChars==/!?
PunctuationChars=<>

[Heuristics]
FunctionCalls=false
Declarations=false
MemberAccess=false
Labels=false
UpperCaseMacros=false
LocalReferences=false
PreprocessorSymbols=false
Attributes=false

[DeclarationKeywords]
Words=device;peripheral;peripherals;register;registers;field;fields;cluster;enumeratedValues;enumeratedValue;cpu;addressBlock;interrupt

[Keywords]
Words=name;description;baseAddress;addressOffset;size;access;resetValue;resetMask;bitOffset;bitWidth;bitRange;lsb;msb;value;groupName;displayName;derivedFrom;dim;dimIncrement;dimIndex;readAction;modifiedWriteValues;writeConstraint;version;vendor;series

[Constants]
Words=read-only;write-only;read-write;writeOnce;read-writeOnce;true;false

# IntraCore C++ syntax description. User-editable. Lists use ; or , as separators.
[Language]
Name=C++
Extensions=cpp;cxx;cc;hpp;hxx;hh;h
FileNames=
LineComment=//
BlockCommentBegin=/*
BlockCommentEnd=*/
StringChars=\"
CharChars='
Preprocessor=#
OperatorChars=+-*/%=!<>&|^~?
PunctuationChars=()[]{}.,:;

[Heuristics]
FunctionCalls=true
Declarations=true
MemberAccess=true
Labels=true
UpperCaseMacros=true
LocalReferences=true
PreprocessorSymbols=true
Attributes=true

[ControlKeywords]
Words=break;case;catch;continue;co_await;co_return;co_yield;default;do;else;for;goto;if;return;switch;throw;try;while

[DeclarationKeywords]
Words=alignas;asm;class;concept;const;consteval;constexpr;constinit;decltype;delete;enum;explicit;export;extern;friend;inline;mutable;namespace;new;noexcept;operator;private;protected;public;register;requires;static;static_assert;struct;template;typedef;typename;union;using;virtual;volatile

[Keywords]
Words=alignof;and;and_eq;auto;bitand;bitor;compl;dynamic_cast;not;not_eq;or;or_eq;reinterpret_cast;sizeof;static_cast;typeid;xor;xor_eq

[BuiltinTypes]
Words=bool;char;char8_t;char16_t;char32_t;double;float;int;long;short;signed;unsigned;void;wchar_t;size_t;ptrdiff_t;u8;u16;u32;u64;s8;s16;s32;s64;uint8_t;uint16_t;uint32_t;uint64_t;int8_t;int16_t;int32_t;int64_t

[Types]
Words=String;RGBColor;SDL_Rect

[Classes]
Words=AppPaths;ConfigFile;Document;DocumentManager;LanguageProfileManager;Settings;SyntaxDefinition;TextBuffer;TextCursor;TextSelection;HID_text_view

[Structs]
Words=SyntaxToken;DirectoryEntry;LanguageProfileDescr

[Unions]
Words=

[Enums]
Words=SyntaxTokenKind

[EnumClasses]
Words=SyntaxTokenKind

[Enumerators]
Words=Normal;Keyword;ControlKeyword;DeclarationKeyword;BuiltinType;Type;ClassName;StructName;UnionName;EnumName;EnumClassName;Enumerator;TypedefName;TemplateParameter;Namespace;FunctionDeclaration;Function;MethodDeclaration;Method;StaticMethod;ExternalCall;GlobalVariable;LocalVariableDeclaration;LocalVariableReference;ParameterVariable;Field;StaticField;Macro;Constant;Builtin;Comment;DocumentationComment;Todo;String;CharLiteral;Escape;Number;Operator;OverloadedOperator;Punctuation;Preprocessor;PreprocessorSymbol;Attribute;Label

[Typedefs]
Words=u8;u16;u32;u64;s8;s16;s32;s64

[TemplateParameters]
Words=T;Item;Value;Key

[Namespaces]
Words=std

[FunctionDeclarations]
Words=main

[Functions]
Words=printf;fprintf;sprintf;snprintf;malloc;free;memset;memcpy;strlen;strcmp;strncmp

[MethodDeclarations]
Words=Load;Save;Draw;Update;HandleEvent;TokenizeLine

[Methods]
Words=append;clear;c_str;length;Load;Save;Draw;Update;HandleEvent

[StaticMethods]
Words=BuildPath;scan;exists;ensureDirectory

[ExternalSDKCalls]
Words=SDL_Init;SDL_Quit;SDL_PollEvent;SDL_RenderPresent;SDL_SetRenderDrawColor

[GlobalVariables]
Words=

[LocalVariableDeclarations]
Words=

[LocalVariables]
Words=

[Parameters]
Words=ctx;line;path;filePath;text;begin;end;tokens;maxTokens;tokenCount

[Fields]
Words=m_loaded;m_id;m_name;m_extensions;m_fileNames;m_lineComment;m_blockCommentBegin;m_blockCommentEnd;m_stringChars;m_charChars;m_preprocessor;m_operatorChars;m_punctuationChars

[StaticFields]
Words=MaxWords;MaxTokens

[Macros]
Words=DEBUG;NDEBUG;NULL;EOF

[Constants]
Words=true;false;nullptr;NULL

[Builtins]
Words=printf;fprintf;sprintf;snprintf;malloc;free;memset;memcpy;strlen;strcmp;strncmp

[Attributes]
Words=nodiscard;maybe_unused;deprecated;fallthrough

[Todo]
Words=TODO;FIXME;NOTE;WARNING;HACK;BUG

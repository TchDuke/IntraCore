[Language]
Name=Shell/Makefile
Extensions=sh;mk;make
FileNames=Makefile;makefile
LineComment=#
BlockCommentBegin=
BlockCommentEnd=
StringChars=\"'`
CharChars=
Preprocessor=
OperatorChars=()[]{}+-*/%=!<>&|^~.,:;?$
PunctuationChars=()[]{}.,:;

[Heuristics]
FunctionCalls=true
MemberAccess=false
Labels=false
UpperCaseMacros=true
LocalReferences=false

[Keywords]
Words=if;then;else;elif;fi;for;while;do;done;case;esac;function;in;export;local;return;exit;echo;cd;test

[Todo]
Words=TODO;FIXME;NOTE;WARNING;HACK;BUG
